name = "builtenv-media"
main = "index.js"
compatibility_date = "2025-01-01"

# Public base URL where objects are readable, e.g.:
#   https://pub-xxxxxxxx.r2.dev   (R2 public bucket URL)
#   https://media.example.com     (custom domain / CDN in front of the bucket)
# Enter the same value in Admin -> Settings -> "Public base URL".
[vars]
PUBLIC_BASE = "https://YOUR_PUBLISHED_R2_URL"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "builtenv-media"

# Set the upload token with:
#   npx wrangler secret put UPLOAD_TOKEN
# then enter the same token in Admin -> Settings -> "Upload token".